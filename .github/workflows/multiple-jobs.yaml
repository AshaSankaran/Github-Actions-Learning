name: Multiple jobs Workflow
on:
  push:
    branches:
      - main
jobs:
  network-job: 
    runs-on: ubuntu-latest 
    steps:
      - name: IP address
        run: ip a 
      - name: google dns
        run:  curl -I https://microsoft.com
  info-job: 
    runs-on: ubuntu-latest
    steps:
      - name: show Date
        run: date
      - name: show current user
        run: whoami
  
